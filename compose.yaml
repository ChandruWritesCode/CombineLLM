services:
  backend:
    build: .
    ports:
      - "127.0.0.1:${COMBINELLM_PORT:-8000}:8000"
    environment:
      COMBINELLM_APP_NAME: ${COMBINELLM_APP_NAME:-CombineLLM}
      COMBINELLM_ENVIRONMENT: ${COMBINELLM_ENVIRONMENT:-development}
      COMBINELLM_GEMINI_API_KEY: ${COMBINELLM_GEMINI_API_KEY:-}
      COMBINELLM_GEMINI_MODEL: ${COMBINELLM_GEMINI_MODEL:-}
      COMBINELLM_PROVIDER_TIMEOUT_SECONDS: ${COMBINELLM_PROVIDER_TIMEOUT_SECONDS:-60}
      COMBINELLM_DATABASE_PATH: /srv/combinellm/data/combinellm.sqlite3
    volumes:
      - chat_data:/srv/combinellm/data
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  chat_data:
